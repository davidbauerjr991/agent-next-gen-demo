<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity Home wireframe</title>
<style>
  :root { --ink:#1a1d23; --muted:#5c6470; --line:#d9dde3; --bg:#f4f6f9; --blue:#2f6fdb; --blue-bg:#eaf1fd; --purple:#6b4fd8; --purple-bg:#efeafb; --amber-bg:#fff3e0; --amber:#9a5b00; --green-bg:#e4f3e8; --green:#1e6b33; --red:#c43a3a; --teal-bg:#dff3f1; --teal:#0f6b63; --pink-bg:#fde8ef; --pink:#9b2c4f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); font-size:13px; line-height:1.4; }
  .top { min-height:48px; flex-wrap:wrap; display:flex; align-items:center; padding:0 16px; gap:12px; background:#fff; border-bottom:1px solid var(--line); }
  .top .brand { font-weight:700; }
  .top .role { margin-left:auto; display:flex; gap:6px; align-items:center; font-size:12px; color:var(--muted); }
  .top .role button { border:1px solid var(--line); background:#fff; border-radius:14px; padding:3px 10px; cursor:pointer; font-size:12px; }
  .top .role button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .top .presence { border:1px solid var(--line); border-radius:14px; padding:3px 10px; font-size:12px; color:var(--amber); }
  .app { display:grid; grid-template-columns:260px 1fr; min-height:calc(100vh - 48px); }
  .nav { background:#fff; border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .nav .outbound { margin:10px; background:var(--blue); color:#fff; border-radius:8px; padding:9px; text-align:center; font-weight:600; }
  .nav .hdr { display:flex; align-items:center; gap:6px; padding:6px 12px; font-weight:700; position:relative; }
  .nav .hdr .dd { border:1px solid var(--line); border-radius:6px; padding:2px 8px; cursor:pointer; background:#fff; font-weight:700; }
  .nav .hdr .count { color:var(--muted); font-weight:400; }
  .nav .hdr .icons { margin-left:auto; color:var(--muted); font-size:12px; }
  .menu { position:absolute; top:34px; left:12px; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.12); width:230px; z-index:5; padding:4px; }
  .menu div { display:flex; align-items:center; padding:6px 8px; border-radius:6px; cursor:pointer; font-weight:400; }
  .menu div:hover { background:var(--bg); }
  .menu div.on { background:var(--blue-bg); color:var(--blue); font-weight:600; }
  .menu .b { margin-left:auto; background:var(--purple-bg); color:var(--purple); border-radius:10px; padding:0 7px; font-size:11px; font-weight:600; }
  .menu .b.red { background:#fde8e8; color:var(--red); }
  .menu .sep { border-top:1px solid var(--line); margin:4px 0; padding:0; height:0; }
  .menu .cfg { color:var(--muted); font-size:11.5px; }
  .cards { flex:1; overflow:auto; padding:0 10px 10px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:8px; cursor:pointer; background:#fff; }
  .card.active { border-color:var(--blue); background:var(--blue-bg); }
  .card .t { font-weight:600; display:flex; align-items:center; gap:6px; }
  .card .m { color:var(--muted); font-size:11.5px; margin-top:3px; display:flex; gap:8px; }
  .card .row { display:flex; align-items:center; gap:6px; margin-top:5px; font-size:11.5px; }
  .chip { display:inline-block; border-radius:10px; padding:1px 7px; font-size:11px; font-weight:600; }
  .k-conversation { background:var(--teal-bg); color:var(--teal); } .k-callback { background:var(--purple-bg); color:var(--purple); } .k-meeting { background:var(--blue-bg); color:var(--blue); } .k-training { background:var(--amber-bg); color:var(--amber); } .k-task { background:var(--pink-bg); color:var(--pink); } .k-coaching { background:#efeafb; color:#4a2f9a; } .k-evaluation { background:#e8eef9; color:#2b4a8a; } .k-campaign { background:#e6f4ea; color:#1e6b33; } .k-sys { background:#eceef2; color:var(--muted); }
  .nav .foot { border-top:1px solid var(--line); padding:8px 12px; display:flex; flex-direction:column; gap:6px; }
  .nav .foot div { padding:4px 6px; border-radius:6px; cursor:pointer; }
  .nav .foot div.on { background:var(--blue-bg); color:var(--blue); font-weight:600; }
  .main { padding:12px; min-width:0; overflow:auto; }
  .page { background:#fff; border:1px solid var(--line); border-radius:10px; min-height:calc(100vh - 72px); }
  .ph { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  .ph h2 { margin:0; font-size:16px; }
  .ph .tabs { margin-left:16px; display:flex; gap:4px; }
  .ph .tabs span { padding:4px 10px; border-radius:6px; color:var(--muted); cursor:pointer; }
  .ph .tabs span.on { background:var(--blue-bg); color:var(--blue); font-weight:600; }
  .ph .right { margin-left:auto; display:flex; gap:6px; }
  .ph .right span { border:1px solid var(--line); border-radius:6px; padding:3px 8px; font-size:12px; color:var(--muted); }
  .feed { padding:12px 16px; }
  .homebody { display:flex; }
  .homebody .feed { flex:1; min-width:0; }
  .homecol { width:280px; border-left:1px solid var(--line); padding:12px; display:flex; flex-direction:column; gap:10px; }
  .welcome { display:flex; align-items:center; gap:14px; padding:14px 16px; border-bottom:1px solid var(--line); background:linear-gradient(90deg,#f7f9fd,#fff); }
  .welcome .av { width:40px; height:40px; border-radius:50%; background:var(--blue); color:#fff; display:grid; place-items:center; font-weight:700; }
  .welcome h3 { margin:0; font-size:16px; }
  .welcome .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  .welcome .go { margin-left:auto; background:var(--green); color:#fff; border-radius:8px; padding:7px 12px; font-weight:600; }
  .stat { display:grid; grid-template-columns:1fr auto; gap:4px 10px; font-size:12px; }
  .stat .v { font-weight:700; text-align:right; }
  .stat .t { color:var(--muted); font-size:11px; }
  .q { display:flex; justify-content:space-between; font-size:12px; padding:3px 0; border-bottom:1px dashed var(--line); }
  .q:last-child { border-bottom:0; }
  .q .n { font-weight:700; }
  .q .w { color:var(--muted); font-size:11px; }
  .q .hot { color:var(--red); font-weight:700; }
  .group { margin-bottom:14px; }
  .group h4 { margin:0 0 6px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .item { display:grid; grid-template-columns:70px 1fr auto; gap:10px; align-items:center; padding:9px 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; cursor:pointer; background:#fff; }
  .item:hover { border-color:var(--blue); }
  .item.live { border-left:3px solid var(--green); }
  .item .time { color:var(--muted); font-size:12px; }
  .item .title { font-weight:600; }
  .item .sub { color:var(--muted); font-size:11.5px; margin-top:2px; }
  .item .st { font-size:11.5px; color:var(--muted); text-align:right; }
  .item.done { opacity:.6; }
  .body { display:flex; min-height:560px; }
  .action { flex:1; padding:14px 16px; min-width:0; }
  .ref { width:260px; border-left:1px solid var(--line); padding:12px; display:flex; flex-direction:column; gap:8px; }
  .rc { border:1px solid var(--line); border-radius:8px; padding:8px; }
  .rc h5 { margin:0; font-size:12px; display:flex; justify-content:space-between; }
  .rc p { margin:6px 0 0; color:var(--muted); font-size:11.5px; }
  .box { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px; }
  .box h4 { margin:0 0 6px; font-size:12.5px; }
  .box.ai { background:var(--purple-bg); border-color:#d9d0f5; }
  .box ul { margin:0; padding-left:16px; }
  .box .acts { display:flex; gap:6px; margin-top:8px; }
  .box .acts span { border:1px solid var(--line); border-radius:6px; padding:3px 9px; font-size:11.5px; background:#fff; cursor:pointer; }
  .box .acts span.p { background:var(--blue); color:#fff; border-color:var(--blue); }
  .sys { color:var(--muted); font-size:11.5px; text-align:center; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); padding:2px; margin:6px 0; }
  .bubble { border-radius:12px; padding:6px 10px; max-width:70%; margin:4px 0; }
  .bubble.cust { background:#eef0f4; } .bubble.agent { background:var(--blue-bg); margin-left:auto; }
  .composer { border:1px solid var(--line); border-radius:10px; margin-top:12px; }
  .composer .seg { display:flex; gap:6px; padding:6px 10px; border-bottom:1px solid var(--line); font-size:12px; }
  .composer .seg span { border:1px solid var(--line); border-radius:6px; padding:2px 8px; color:var(--muted); }
  .composer .seg span.on { color:var(--blue); background:var(--blue-bg); font-weight:600; }
  .composer .field { padding:9px 10px; color:var(--muted); }
  .outcome { border:2px solid var(--green); border-radius:10px; padding:10px; margin-top:10px; }
  .note { margin:0 0 10px; padding:8px 10px; background:#fff; border:1px solid var(--line); border-radius:8px; color:var(--muted); font-size:12px; }
  .note b { color:var(--blue); }
  .empty { color:var(--muted); padding:30px; text-align:center; }
  /* ── P-HOME-1: layout switch; P-HOME-2: connections, inbox rows, filter chips, toasts ── */
  .top .layout { display:flex; gap:4px; align-items:center; font-size:12px; color:var(--muted); margin-left:14px; }
  .top .layout button { border:1px solid var(--line); background:#fff; border-radius:14px; padding:3px 10px; cursor:pointer; font-size:12px; }
  .top .layout button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  .top .conn { display:flex; gap:4px; align-items:center; font-size:12px; color:var(--muted); margin-left:14px; }
  .top .conn button { border:1px solid var(--line); background:#fff; border-radius:14px; padding:3px 7px; cursor:pointer; font-size:11px; }
  .top .conn button.on { background:var(--green-bg); color:var(--green); border-color:#bfe0c8; }
  .filters { display:flex; gap:6px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .filters span { border:1px solid var(--line); border-radius:14px; padding:2px 10px; font-size:12px; color:var(--muted); cursor:pointer; background:#fff; }
  .filters span.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .filters .n { margin-left:4px; opacity:.7; }
  .item.inbox { border-left:3px dashed #b9c0cc; background:#fbfcfe; }
  .item.inbox .title { font-weight:500; }
  .src { display:inline-block; border-radius:10px; padding:1px 7px; font-size:11px; font-weight:600; background:#eceef2; color:var(--muted); }
  .src.calendar { background:#e8eef9; color:#2b4a8a; } .src.salesforce { background:#e3f1fb; color:#0b5c8e; } .src.jira { background:#e6ecfa; color:#1d3f8f; } .src.zendesk { background:#e4f3e8; color:#1e6b33; } .src.servicenow { background:#e5f5ee; color:#176b4d; } .src.mail { background:#fff3e0; color:var(--amber); } .src.teams { background:#efeafb; color:#4a2f9a; } .src.slack { background:#fde8ef; color:var(--pink); }
  .item .acts { display:flex; gap:4px; justify-content:flex-end; margin-top:4px; }
  .item .acts span { border:1px solid var(--line); border-radius:6px; padding:1px 7px; font-size:11px; background:#fff; }
  .item.new { animation:pop .5s ease-out; }
  @keyframes pop { from { background:var(--amber-bg); } to { background:#fbfcfe; } }
  /* one-column Home: sections as rows, the feed inside a container like Contact History */
  .sections { padding:12px 16px; display:flex; flex-direction:column; gap:12px; }
  .section { border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .section h4 { margin:0 0 8px; font-size:13px; display:flex; align-items:center; gap:8px; }
  .section h4 .chip { margin-left:auto; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .section .rc { border:0; padding:0; }
  /* toasts */
  .toasts { position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column-reverse; gap:8px; z-index:20; width:320px; }
  .toast { background:#fff; border:1px solid var(--line); border-left:3px solid var(--blue); border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.12); padding:8px 10px; font-size:12px; }
  .toast .t { font-weight:600; display:flex; gap:6px; align-items:center; }
  .toast .acts { display:flex; gap:6px; margin-top:6px; }
  .toast .acts span { border:1px solid var(--line); border-radius:6px; padding:2px 8px; cursor:pointer; }
  .toast .acts span.p { background:var(--blue); color:#fff; border-color:var(--blue); }
  /* Connect your apps step */
  .scrim { position:fixed; inset:0; background:rgba(20,24,32,.45); display:grid; place-items:center; z-index:30; }
  .modal { width:560px; max-height:90vh; overflow:auto; background:#fff; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.3); padding:18px 20px; }
  .modal h3 { margin:0 0 4px; font-size:17px; }
  .modal .sub { color:var(--muted); font-size:12px; margin-bottom:12px; }
  .srcrow { display:grid; grid-template-columns:28px 1fr auto; gap:10px; align-items:center; padding:6px 6px; border-top:1px solid var(--line); }
  .srcrow:last-of-type { border-bottom:1px solid var(--line); }
  .srcrow .nm { font-weight:600; } .srcrow .d { color:var(--muted); font-size:11.5px; }
  .srcrow button { border:1px solid var(--line); background:#fff; border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px; }
  .srcrow button.on { background:var(--green-bg); color:var(--green); border-color:#bfe0c8; }
  .srcrow .exp { font-size:10.5px; color:var(--blue); background:var(--blue-bg); border-radius:8px; padding:0 6px; margin-left:6px; }
  .modal .foot { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  .modal .foot button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 14px; cursor:pointer; }
  .modal .foot button.p { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:600; }
</style>
</head>
<body>
<div class="top">
  <span class="brand">Agent Workspace</span>
  <span style="color:var(--muted);font-size:12px">— Activity Home (P-HOME-1) + personal connections (P-HOME-2)</span>
  <div class="layout">home.layout: <button data-layout="oneColumn">One column</button><button data-layout="twoColumn" class="on">Two columns</button></div>
  <div class="conn">Your apps: <button data-src="calendar">📅 Calendar</button><button data-src="mail">✉️ Mail</button><button data-src="teams">💠 Teams</button><button data-src="slack">＃ Slack</button><button data-src="salesforce">☁️ Salesforce</button><button data-src="jira">🔷 Jira</button><button data-src="zendesk">🟢 Zendesk</button><button data-src="servicenow">🟩 ServiceNow</button></div>
  <div class="role">Persona: <button data-role="agent" class="on">Agent</button><button data-role="supervisor">Supervisor</button><button data-role="sales">Sales</button> <span class="presence">● Working · 00:04</span></div>
</div>
<div class="toasts" id="toasts"></div>
<div id="connectStep"></div>
<div class="app">
  <div class="nav">
    <div class="outbound">+ New Outbound</div>
    <div class="hdr"><span class="dd" id="viewBtn">Assignments ▾</span><span class="count" id="viewCount">(0)</span><span class="icons">⇅ ⚙</span>
      <div class="menu" id="viewMenu" style="display:none"></div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="foot"><div id="homeBtn" class="on">🏠 Home</div><div>⚙ Settings</div></div>
  </div>
  <div class="main"><div class="page" id="page"></div></div>
</div>

<script>
// ── Kinds registry: each kind declares its row chip, its main-column renderer and its outcome shape ──
const KINDS = {
  conversation: { label:"Conversation", icon:"💬", outcome:"disposition" },
  callback:     { label:"Callback",     icon:"📞", outcome:"disposition" },
  meeting:      { label:"Meeting",      icon:"📅", outcome:"notes + action items" },
  training:     { label:"Training",     icon:"🎓", outcome:"completion" },
  task:         { label:"Task",         icon:"🎫", outcome:"ticket status" },
  coaching:     { label:"Coaching",     icon:"🧭", outcome:"coaching notes" },
  evaluation:   { label:"Evaluation",   icon:"✅", outcome:"scorecard" },
  campaign:     { label:"Campaign block", icon:"📣", outcome:"block summary" },
};
const ROLE_KINDS = {
  agent: ["conversation","callback","meeting","training","task"],
  supervisor: ["meeting","coaching","evaluation","conversation","task"],
  sales: ["callback","campaign","meeting","task","conversation"],
};
// ── Seeded day. `when` is minutes from "now" (now = 10:30). state: offered | active | scheduled | done ──
const ITEMS = [
  { id:"a1", kind:"conversation", title:"Maya Chen · Voice · Returns", sub:"Active call · 00:04 · cracked water tank refund", when:-4, state:"active", source:"Inbound", customer:"Maya Chen" },
  { id:"a2", kind:"conversation", title:"Lucas Thomas · Chat · AI Review", sub:"Checkout AI Agent requested approval", when:-1, state:"offered", source:"Escalated from virtual agent", customer:"Lucas Thomas" },
  { id:"a3", kind:"callback", title:"Callback · Priya Shah", sub:"Requested yesterday · refund hasn't posted", when:30, state:"scheduled", source:"Customer request", customer:"Priya Shah" },
  { id:"a4", kind:"meeting", title:"Returns team stand-up", sub:"Teams · 15 min · 6 attendees", when:90, state:"scheduled", source:"Calendar" },
  { id:"a5", kind:"training", title:"RET-1.3 refund policy update", sub:"Module · 20 min · due Friday", when:180, state:"scheduled", source:"WFM" },
  { id:"a6", kind:"task", title:"Ticket #4821 · subscription renewal refund", sub:"Follow up with Billing on the credit", when:240, state:"scheduled", source:"Ticket queue", customer:"Priya Shah" },
  { id:"a7", kind:"callback", title:"Callback · Nathan Cole", sub:"Confirm access after the reset", when:1500, state:"scheduled", source:"Agent scheduled", customer:"Nathan Cole" },
  { id:"a8", kind:"meeting", title:"1:1 with Dana (supervisor)", sub:"30 min", when:2900, state:"scheduled", source:"Calendar" },
  { id:"a9", kind:"training", title:"WhatsApp templates · intro", sub:"Module · 25 min", when:4300, state:"scheduled", source:"WFM" },
  { id:"d1", kind:"conversation", title:"Nathan Cole · Voice · General Support", sub:"Resolved · Account access — reset", when:-29, state:"done", customer:"Nathan Cole" },
  { id:"d2", kind:"conversation", title:"Omar Farooq · Email · Sales", sub:"Resolved · Plan upgrade confirmation", when:-120, state:"done", customer:"Omar Farooq" },
  // supervisor / sales extras
  { id:"s1", roles:["supervisor"], kind:"coaching", title:"Coaching · John Smith", sub:"Review 2 calls from Thursday · 30 min", when:60, state:"scheduled", source:"QM" },
  { id:"s2", roles:["supervisor"], kind:"evaluation", title:"Evaluate · Lucas Thomas chat (Checkout AI)", sub:"Scorecard · AI auto-score ready for review", when:20, state:"scheduled", source:"QM" },
  { id:"s3", roles:["supervisor"], kind:"conversation", title:"Escalation · Lauren Briggs · Voice", sub:"Agent raised hand · fraud dispute", when:-2, state:"offered", source:"Escalation", customer:"Lauren Briggs" },
  { id:"c1", roles:["sales"], kind:"campaign", title:"Campaign block · Q4 renewals · 2:00–3:30", sub:"24 contacts · cadence step 2 (voice)", when:210, state:"scheduled", source:"Campaigns" },
  { id:"c2", roles:["sales"], kind:"callback", title:"Follow-up · Acme Corp · Omar Farooq", sub:"Quote sent Tuesday · decision due", when:45, state:"scheduled", source:"Sales cadence" },
];
const VIEWS = [
  { id:"active", label:"Active", filter:i=>i.state==="active" },
  { id:"offered", label:"Offered", filter:i=>i.state==="offered", badge:"red" },
  { id:"scheduled", label:"Scheduled", filter:i=>i.state==="scheduled" && i.when<=600 },
  { id:"done", label:"Completed today", filter:i=>i.state==="done" },
  { sep:true },
  { id:"v-chat", label:"Chat only (saved view)", filter:i=>i.kind==="conversation" && /Chat/.test(i.title) && i.state!=="done", cfg:true },
  { id:"v-callbacks", label:"My callbacks (saved view)", filter:i=>i.kind==="callback", cfg:true },
];
// ── P-HOME-2: personal connections (personal scope) and the inbox items they feed into Home ──
// A source is the person's own app. An inbox item is NOT an assignment: no customer, no leg, no outcome.
// It can be promoted ("Make a task" → a task assignment). A calendar event with a join link is the `meeting` kind.
const SOURCES = {
  calendar: { label:"Calendar", icon:"📅", desc:"Outlook / Google — meetings become `meeting` assignments; other events are inbox rows" },
  mail:     { label:"Mail",     icon:"✉️", desc:"Your own mailbox — new mail from now on; never the customer email channel" },
  teams:    { label:"Teams",    icon:"💠", desc:"Direct messages and mentions; new ones toast" },
  slack:    { label:"Slack",    icon:"＃", desc:"Direct messages and mentions; new ones toast" },
  salesforce:{ label:"Salesforce", icon:"☁️", desc:"Cases and opportunities assigned to you; updates become rows" },
  jira:     { label:"Jira",     icon:"🔷", desc:"Issues assigned to you or mentioning you" },
  zendesk:  { label:"Zendesk",  icon:"🟢", desc:"Tickets assigned to you; new comments become rows" },
  servicenow:{ label:"ServiceNow", icon:"🟩", desc:"Incidents and requests assigned to you" },
};
// Which sources each persona's profile expects (profiles declare `expectsConnections`; the step asks for the missing ones).
const EXPECTS = { agent:["calendar","mail","zendesk"], supervisor:["calendar","mail","teams"], sales:["calendar","mail","slack","salesforce"] };
let connected = []; // personal scope — survives profile changes, which is why the step only asks for what's missing
// Seeded day per source (what `connect()` loads), then a trickle of new items every ~12s while connected.
const INBOX_SEED = {
  calendar: [
    { id:"i-c1", src:"calendar", title:"Dentist", sub:"Personal · 45 min · out of office block", when:420 },
    { id:"i-c2", src:"calendar", title:"Focus time — RET-1.3 reading", sub:"Blocked by you", when:300 },
  ],
  mail: [
    { id:"i-m1", src:"mail", title:"Dana Whitfield · Thursday's schedule swap", sub:"\"Can you cover 1–3pm Thursday? Priya is out…\"", when:-45 },

let INBOX = [];     // live inbox items for connected sources
let trickleTimer = null, trickleN = 0;

function connect(src){ if(connected.includes(src)) return; connected.push(src); INBOX.push(...INBOX_SEED[src].map(x=>({...x}))); startTrickle(); render(); }
function disconnect(src){ connected = connected.filter(s=>s!==src); INBOX = INBOX.filter(i=>i.src!==src); filters.delete(src); render(); }
function startTrickle(){ if(trickleTimer) return; trickleTimer = setInterval(()=>{
  const srcs = connected.filter(s=>TRICKLE[s].length); if(!srcs.length) return;
  const src = srcs[trickleN++ % srcs.length]; const t = TRICKLE[src].shift(); if(!t) return;
  const it = { id:"i-new"+trickleN, src, title:t.title, sub:t.sub, when:t.when ?? 0, fresh:true };
  INBOX.unshift(it);
  if(src==="teams"||src==="slack") toast(`${SOURCES[src].icon} ${t.title}`, t.sub, it.id); // notifications.toasts per-source switch
  render();
}, 12000); }
function toast(title, body, id){ const el=document.createElement("div"); el.className="toast"; el.innerHTML=`<div class="t">${title}</div><div style="color:var(--muted);margin-top:2px">${body}</div><div class="acts"><span class="p">View</span><span>Dismiss</span></div>`;
  el.querySelector(".p").onclick=()=>{ openInbox(id); el.remove(); }; el.querySelectorAll(".acts span")[1].onclick=()=>el.remove();
  document.getElementById("toasts").appendChild(el); setTimeout(()=>el.remove(), 9000); }
// "Make a task" = this is my work now: the item becomes a task assignment, joins the rail, leaves the feed, and opens in the main
// column with the source record as its first reference card. "Later" creates it scheduled and leaves it in the feed.
function promote(id, later){ const it = INBOX.find(x=>x.id===id); if(!it) return; INBOX = INBOX.filter(x=>x.id!==id);
  const t = { id:"p-"+id, kind:"task", title:"Task · "+it.title, sub:"From "+SOURCES[it.src].label+" · "+it.sub, when: later?60:0, state:"scheduled", source:SOURCES[it.src].label, from:it };
  ITEMS.push(t); if(later){ current=null; render(); } else { open(t.id); } }
// The step: after first login, and whenever the applied profile expects a source that isn't connected. Skippable; re-reachable from Settings → Connections → Your apps.
function showConnectStep(reason){
  const missing = EXPECTS[role].filter(s=>!connected.includes(s));
  const pick = new Set(missing);
  const host = document.getElementById("connectStep");
  const draw = () => { host.innerHTML = `<div class="scrim"><div class="modal">
    <h3>Connect your apps</h3><div class="sub">${reason}. Your calendar, mail and team chat feed your Activity feed from now on. These are yours — not your team's — and you can change them any time in Settings → Connections → Your apps.</div>
    ${Object.keys(SOURCES).map(s=>`<div class="srcrow"><div style="font-size:18px">${SOURCES[s].icon}</div><div><div class="nm">${SOURCES[s].label}${EXPECTS[role].includes(s)?'<span class="exp">expected by this profile</span>':''}${connected.includes(s)?'<span class="exp" style="background:var(--green-bg);color:var(--green)">connected</span>':''}</div><div class="d">${SOURCES[s].desc}</div></div>
      <button data-s="${s}" class="${pick.has(s)||connected.includes(s)?'on':''}" ${connected.includes(s)?'disabled':''}>${connected.includes(s)?'Connected':pick.has(s)?'✓ Connect':'Connect'}</button></div>`).join("")}
    <div class="foot"><button id="skip">Skip for now</button><button class="p" id="go">Connect ${pick.size?pick.size+" app"+(pick.size>1?"s":""):"nothing"} and continue</button></div></div></div>`;
    host.querySelectorAll("button[data-s]").forEach(b=>b.onclick=()=>{ const s=b.dataset.s; pick.has(s)?pick.delete(s):pick.add(s); draw(); });
    host.querySelector("#skip").onclick=()=>{ host.innerHTML=""; };
    host.querySelector("#go").onclick=()=>{ host.innerHTML=""; pick.forEach(s=>connect(s)); };
  };
  draw();
}

const fmt = m => { const t=10*60+30+m; const h=Math.floor(t/60), mm=String(t%60).padStart(2,"0"); const d=Math.floor(t/1440); const hh=((h%24)+11)%12+1, ap=(h%24)<12?"AM":"PM"; return (d>0?["Tomorrow","Wed","Thu","Fri"][d-1]+" ":"")+hh+":"+mm+" "+ap; };
const kindsFor = () => ROLE_KINDS[role];
const visible = () => ITEMS.filter(i=>kindsFor().includes(i.kind) && (!i.roles || i.roles.includes(role))).sort((a,b)=>a.when-b.when);
const chip = k => `<span class="chip k-${k}">${KINDS[k].icon} ${KINDS[k].label}</span>`;

      <div class="outcome"><b>Outcome (task kind):</b> ticket status + note.</div>`;
  if (K==="coaching") action = `
      <div class="box"><h4>${i.title}</h4>${i.sub}<div class="acts"><span class="p">Open call 1</span><span>Open call 2</span><span>Start session</span></div></div>
      <div class="box ai"><h4>Copilot</h4>Both calls: long holds before the refund decision. Suggested focus: RET-1.3 authority limits.<div class="acts"><span class="p">Use as agenda</span></div></div>
      <div class="outcome"><b>Outcome (coaching kind):</b> coaching notes + follow-up date.</div>`;
  if (K==="evaluation") action = `
      <div class="box"><h4>${i.title}</h4>${i.sub}<div class="acts"><span class="p">Open transcript</span><span>Play recording</span></div></div>
      <div class="box"><h4>Scorecard</h4><ul><li>Greeting · AI: 5/5</li><li>Verification · AI: 3/5 — review</li><li>Resolution · AI: 4/5</li></ul></div>
      <div class="outcome"><b>Outcome (evaluation kind):</b> scorecard + evaluator overrides.</div>`;
  if (K==="campaign") action = `
      <div class="box"><h4>${i.title}</h4>${i.sub}<div class="acts"><span class="p">Start block</span><span>Preview list</span></div></div>
      <div class="box"><h4>Next up</h4><ul><li>Acme Corp · Omar Farooq · renewal due Nov 1</li><li>Northwind · Lauren Briggs · renewal due Nov 3</li></ul></div>
      <div class="note" style="margin-top:10px">Each dial in the block is its own conversation assignment, linked to the block.</div>
      <div class="outcome"><b>Outcome (campaign block kind):</b> block summary (reached / converted / opted out).</div>`;
  document.getElementById("page").innerHTML = `
    <div class="ph"><h2>${i.customer||i.title}</h2>${chip(K)}<span class="chip k-sys">${i.state==="active"?"Active":i.state==="offered"?"Offered":"Scheduled · "+fmt(i.when)}</span>
      <div class="right"><span>Session Details ›</span><span>Outcome ✓</span>${i.customer?'<span>Contact Details</span>':''}</div></div>
    <div class="body"><div class="action">${action}</div>${ref}</div>`;
}

// An inbox item opens in the main column like an assignment does — same page shell, the source's content as the action area,
// the reference column with what the app knows — but it does NOT join the Assignments rail (it isn't one) and has no Outcome.
function renderInbox(i){
  const S = SOURCES[i.src];
  let action = "";
  if (i.src==="mail") action = `
      <div class="box"><h4>${i.title}</h4><div style="color:var(--muted);font-size:11.5px;margin-bottom:8px">To: you · ${fmt(i.when)} · via your mailbox</div>
        <p style="margin:0">${i.sub.replace(/^"|"$/g,"")} Let me know by end of day if that works — I'll update the schedule in WFM once I hear back. Thanks!</p>
        <div class="acts"><span class="p">Reply</span><span>Reply all</span><span>Forward</span><span>Open in Outlook</span></div></div>
      <div class="box ai"><h4>Copilot</h4>Thursday 1–3pm is free on your calendar; your RET-1.3 reading block is at 3:00. Draft a yes?<div class="acts"><span class="p">Draft reply</span><span>Not now</span></div></div>
      <div class="composer"><div class="seg"><span class="on">Reply via Mail</span><span>Ask Copilot</span></div><div class="field">Reply here — sent through your mailbox, never through the customer email channel.</div></div>`;
  if (i.src==="teams" || i.src==="slack") action = `
      <div class="box"><h4>${i.title}</h4><div style="color:var(--muted);font-size:11.5px;margin-bottom:8px">${S.label} · ${i.when===0?"just now":fmt(i.when)}</div>
        <div class="bubble cust">${i.sub.replace(/^"|"$/g,"")}</div>
        <div class="bubble cust" style="opacity:.6">(earlier) Morning! Briggs is in the Returns queue again.</div>
        <div class="acts"><span class="p">Reply</span><span>Open in ${S.label}</span><span>Start a call</span></div></div>
      <div class="box ai"><h4>Copilot</h4>Dana is asking about Lauren Briggs — her escalation is an open assignment. Open it beside this thread?<div class="acts"><span class="p">Open Briggs</span><span>Not now</span></div></div>
      <div class="composer"><div class="seg"><span class="on">Reply via ${S.label}</span><span>Ask Copilot</span></div><div class="field">Short reply — this is team chat, not a customer thread.</div></div>`;
  if (["salesforce","jira","zendesk","servicenow"].includes(i.src)) action = `
      <div class="box"><h4>${i.title}</h4><div style="color:var(--muted);font-size:11.5px;margin-bottom:8px">${S.label} · ${i.sub}</div>
        <div style="height:120px;border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;color:var(--muted)">Record summary from ${S.label} (fields the connector maps; the record itself opens in ${S.label})</div>
        <div class="acts"><span class="p">Open in ${S.label}</span><span>Add comment</span><span>Change status</span></div></div>
      <div class="box ai"><h4>Copilot</h4>${i.src==="zendesk"?"Priya Shah has a callback at 11:00 on this same credit — the ticket and the callback are the same issue. Link them?":i.src==="salesforce"?"Omar Farooq's follow-up at 11:15 is this opportunity. Open the cadence step beside it?":"This item mentions a customer with an open assignment — link them?"}<div class="acts"><span class="p">Link</span><span>Not now</span></div></div>
      <div class="note">A record assigned to you is an inbox row until you make it a task; the customer's own history stays in the app's record (the CRM is a database behind it).</div>`;
  if (i.src==="calendar") action = `
      <div class="box"><h4>${i.title}</h4>${fmt(i.when)} · ${i.sub}<div class="acts"><span class="p">Open in Calendar</span><span>Snooze</span><span>Decline</span></div></div>
      <div class="note">A calendar entry with attendees and a join link would be a <b>meeting</b> assignment (kinds registry) and open as one. This is a personal block, so it's an inbox row: nothing to outcome.</div>`;
  const ref = `<div class="ref">
      <div class="rc"><h5>From your apps <span class="src ${i.src}">${S.label}</span></h5><p>Personal connection · ${S.desc}</p></div>
      <div class="rc"><h5>Related work</h5><p>${i.src==="mail"?"Thursday's shift · WFM schedule · Priya Shah's callback (11:00)":i.src==="calendar"?"RET-1.3 training (due Friday)":"Lauren Briggs · escalation (Offered) · Dana Whitfield (supervisor)"}</p></div>
      <div class="rc"><h5>Copilot</h5><p>Scoped to this item, as on a contact.</p></div></div>`;
  document.getElementById("page").innerHTML = `
    <div class="ph"><h2>${S.icon} ${i.title}</h2><span class="src ${i.src}">${S.label}</span><span class="chip k-sys">Inbox item · not an assignment</span>
      <div class="right"><span data-promote="${i.id}" style="cursor:pointer">Make a task</span><span>Done</span><span id="backHome" style="cursor:pointer">← Home</span></div></div>
    <div class="body"><div class="action">${action}</div>${ref}</div>`;
  document.querySelector("[data-promote]").onclick=()=>promote(i.id);
  document.getElementById("backHome").onclick=()=>{ current=null; render(); };
}
function openInbox(id){ current="inbox:"+id; render(); }
function open(id){ current=id; if(!opened.includes(id)) opened.push(id); const it=ITEMS.find(x=>x.id===id); if(it.state==="scheduled"||it.state==="offered"){ it.state="active"; it.when=0; } render(); }
function render(){ renderNav(); if(typeof current==="string" && current.startsWith("inbox:")){ const ib=INBOX.find(x=>x.id===current.slice(6)); if(ib){ renderInbox(ib); return; } current=null; } const it=ITEMS.find(x=>x.id===current); if(it) renderAssignment(it); else renderHome(); }

document.getElementById("viewBtn").onclick=(e)=>{ e.stopPropagation(); menuOpen=!menuOpen; renderNav(); };
document.body.addEventListener("click",()=>{ if(menuOpen){ menuOpen=false; renderNav(); } });
document.getElementById("homeBtn").onclick=()=>{ current=null; render(); };
document.querySelectorAll(".role button").forEach(b=>b.onclick=()=>{ role=b.dataset.role; document.querySelectorAll(".role button").forEach(x=>x.classList.toggle("on",x===b)); current=null; opened=["a1"]; ITEMS.forEach(i=>{ if(i.id!=="a1"&&i.state==="active"){ i.state="scheduled"; } });
  // Profile change: personal connections persist; the step re-appears only if the new profile expects a source that isn't connected.
  layout = role==="agent" ? "oneColumn" : "twoColumn"; // AI-first-style built-ins default twoColumn; the plain agent profile keeps today's one-column Home
  document.querySelectorAll(".layout button").forEach(x=>x.classList.toggle("on",x.dataset.layout===layout));
  render(); if (EXPECTS[role].some(s=>!connected.includes(s))) showConnectStep("You switched to the "+role+" profile, which expects more apps"); });
document.querySelectorAll(".layout button").forEach(b=>b.onclick=()=>{ layout=b.dataset.layout; document.querySelectorAll(".layout button").forEach(x=>x.classList.toggle("on",x===b)); render(); });
function renderConnButtons(){ document.querySelectorAll(".conn button").forEach(b=>{ const s=b.dataset.src; b.classList.toggle("on",connected.includes(s)); b.textContent=(connected.includes(s)?"✓ ":"")+SOURCES[s].icon+" "+SOURCES[s].label; b.onclick=()=>connected.includes(s)?disconnect(s):connect(s); }); }
const _render = render; render = function(){ _render(); renderConnButtons(); };
render();
showConnectStep("Welcome, John — first sign-in"); // first login: the step runs after the welcome modal
</script>
</body>
</html>
